# Render Blueprint. Secrets use sync: false and are set in the Render dashboard, never here.
services:
  - type: web
    name: offscript-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --package offscript-api --locked --no-dev
    startCommand: cd api && uv run --no-sync uvicorn offscript_api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OFFSCRIPT_ENV
        value: production
      - key: OFFSCRIPT_MODE
        value: live
      - key: CORS_ORIGINS
        sync: false # deployed web origin
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_PATH
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

  - type: web
    name: offscript-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # deployed API URL
