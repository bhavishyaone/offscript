[project]
name = "offscript-api"
version = "0.1.0"
description = "Offscript FastAPI backend."
requires-python = ">=3.11"
dependencies = [
    "offscript-contract",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tinker>=0.33.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offscript_api"]
